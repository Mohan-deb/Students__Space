<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Student Space for Government Polytechnic Srikakulam students.">
    <meta name="keywords" content="Student Space,Polytechnic,students,studentspace">
    <title>Student Login</title>
    <link rel="stylesheet" href="StudentLogin.css">

<style>
.password-wrapper{position:relative;display:flex;align-items:center;width:100%}
.password-wrapper input{width:100%;padding-right:46px}
.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;padding:5px}
.password-toggle:hover{background:rgba(37,99,235,.08)}
.password-toggle:focus-visible{outline:2px solid #2563eb;outline-offset:1px}
.password-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

<body>
    <div class="flex-container">
        <div class="flex-container1">
            <h2>Student Space</h2>
            <h3>Enter Your Login Credentials</h3>
        </div>

        <div>
            <form action="" method="post" id="StudentForm">
            <fieldset>
                <div class=" flex-container2">
                <label for=" userId">Email / PIN:</label>
                <input type="text" id="userId" name="username" placeholder="Enter Email or PIN">
        </div>
        <div class="flex-container2">
            <label for="password">Password:</label>
            <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter Password">
            <button type="button" class="password-toggle" aria-label="Show password" title="Show password" data-target="password"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button>
        </div>
        </div>
        <div class="flex-container4">
            <button type="submit" id="Studentlogin">Login</button>
             <button type="button" id="btnsignup"><a href="signupform.html">Create Account</a></button>
            
        </div>
        <div class="flex-container4">            
            <a href="ForgotPass.html" id="forgot">Forgot Password?</a>
        </div>

        </fieldset>
        </form>
    </div>
    </div>

<script>
document.querySelectorAll('.password-toggle').forEach(function(button){
    button.addEventListener('click', function(){
        const input = document.getElementById(button.dataset.target);
        const showing = input.type === 'password';
        input.type = showing ? 'text' : 'password';
        button.innerHTML = showing ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.1 3.6M6.2 6.8C3.5 8.6 2 12 2 12s3.5 6 10 6c1.8 0 3.4-.4 4.8-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>` : `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>`;
        button.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
        button.setAttribute('title', showing ? 'Hide password' : 'Show password');
    });
});
</script>
</body>

</html>
