<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="Student Space for Government Polytechnic Srikakulam students.">
    <meta name="keywords" content="Student Space,Polytechnic,students,studentspace">
    <title>Teacher Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/StudentLogin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/Teacher.css') }}">
</head>

<body>
    <div class="flex-container">
        <div class="flex-container1">
            <h2>Students Space</h2>
            <h3>Enter Your Login Credentials</h3>
        </div>

        <div class="flex-container2">
            <form action="" method="post" id="TeacherForm">
                <fieldset>
                    <div class=" flex-container2">
                        <label for=" userId">Email:</label>
                        <input type="email" id="teachermail" name="teachermail" placeholder="Enter Email" required>
                    </div>
                    <div class="flex-container2">
                        <label for="password">Password:</label>
                        <input type="password" id="teacherpassword" name="teacherpassword" placeholder="Enter Password"
                            required>
                    </div>
                    <div class="flex-container4">
                        <button type="submit" id="teachersubmit">Login</button>
                        <a href="{{ url_for('forgot_password')}}">Forgot Password?</a>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
</body>

<script src="{{ url_for('static', filename='js/check_user_credentials.js')}}"></script>

</html>
