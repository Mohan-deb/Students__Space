<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Signup Page</title>
    <link rel="stylesheet" href="signupform.css">

<style>
.password-wrapper{position:relative;display:flex;align-items:center;width:100%}
.password-wrapper input{width:100%;padding-right:46px}
.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:6px;padding:5px}
.password-toggle:hover{background:rgba(37,99,235,.08)}
.password-toggle:focus-visible{outline:2px solid #2563eb;outline-offset:1px}
.password-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

<body>
    <div class="form-container">
        <h2>Student Space</h2>
        <h3>Create Your Login Credentials</h3>
        <form action="" method="post">
            <fieldset>
                <div class="flex-items">
                    <label for="createuser">Create Username:</label>
                    <input type="text" id="createuser" placeholder="Enter your name">
                </div>
                <div class="flex-items">
                    <label for="userpin">Enter PIN:</label>
                    <input type="text" id="userpin" placeholder="Enter your Unique PIN">
                </div>
                <div class="flex-items">

                    <label for="usermail">Enter Email:</label>
                    <input type="email" id="usermail" placeholder="Enter your Email">
                </div>
                <div class="flex-items">
                    <label for="branchid">Select Branch:</label>
                    <select name="Branchname" id="branchid">
                        <option value="CME">Computer Engineering</option>
                        <option value="MECH">Mechanical Engineering</option>
                        <option value="EEE">Electrical And Electronical Engineering </option>
                        <option value="CIVIL">Civil Engineering</option>
                        <option value="CCP">Comercial and Computer Engineering</option>
                    </select>
                </div>
                <div class="flex-items">
                    <label for="year">Select Year:</label>
                    <select name="year" id="year">
                        <option value="1">1st year</option>
                        <option value="2">2nd year</option>
                        <option value="3">3rd year</option>
                    </select>
                </div>
                <div class="flex-items">
                    <label for="semId">Current Semster:</label>
                    <input type="number" min="1" max="6">
                </div>
                <div class="flex-items">
                    <label for="pass">Create Password:</label>
                    <div class="password-wrapper"><input type="password" id="pass" name="password"><button type="button" class="password-toggle" aria-label="Show password" title="Show password" data-target="pass"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
                </div>
                <div class="flex-items">
                    <label for="Retype">Re-Enter Password:</label>
                    <div class="password-wrapper"><input type="password" id="Retype" name="validpass"><button type="button" class="password-toggle" aria-label="Show password" title="Show password" data-target="Retype"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
                </div>
                <div class="flex-item1">
                    <button type="submit" id="signin">Signin</button>
                    <p>Already have Account<a href="StudentLogin.html">Login</a></p>
                </div>
            </fieldset>
        </form>
    </div>

<script>
document.querySelectorAll('.password-toggle').forEach(function(button){
    button.addEventListener('click', function(){
        const input = document.getElementById(button.dataset.target);
        const showing = input.type === 'password';
        input.type = showing ? 'text' : 'password';
        button.innerHTML = showing ? `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.1 3.6M6.2 6.8C3.5 8.6 2 12 2 12s3.5 6 10 6c1.8 0 3.4-.4 4.8-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>` : `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>`;
        button.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
        button.setAttribute('title', showing ? 'Hide password' : 'Show password');
    });
});
</script>
</body>

</html>
